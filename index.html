<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--panel:#FFFFFF;--ink:#16202E;--mute:#5E6B7E;--line:#D5DBE5;--me:#1F3A8A;--me-ink:#fff;--bot:#E3E8F1}
@media (prefers-color-scheme:dark){:root{--bg:#0F141D;--panel:#171E2A;--ink:#E6EAF2;--mute:#8A97AB;--line:#273041;--me:#5B7CFA;--me-ink:#0B1020;--bot:#212A3A}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.05rem;font-weight:600;margin:0}
button{font:inherit;cursor:pointer}
#clear{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:4px 10px}
#clear:hover{color:var(--ink)}
#log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.empty{margin:auto;color:var(--mute);text-align:center}
form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:160px}
textarea:focus,button:focus-visible{outline:2px solid var(--me);outline-offset:1px}
#send{background:var(--me);color:var(--me-ink);border:0;border-radius:10px;padding:0 18px;font-weight:500}
#send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header><h1>Gemini Chat</h1><button id="clear" type="button">New chat</button></header>
  <div id="log"><p class="empty">Ask anything to start the conversation.</p></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const log=document.getElementById('log'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send');
let history=[];

function add(role,text){
  const empty=log.querySelector('.empty'); if(empty) empty.remove();
  const el=document.createElement('div'); el.className='msg '+role; el.textContent=text;
  log.appendChild(el); log.scrollTop=log.scrollHeight; return el;
}

async function ask(){
  const text=input.value.trim(); if(!text) return;
  input.value=''; input.style.height='auto';
  history.push({role:'user',content:text}); add('user',text);
  const bot=add('bot','…'); send.disabled=true; let reply='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    if(!res.ok) throw new Error((await res.json()).error||res.statusText);
    const reader=res.body.getReader(), dec=new TextDecoder();
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      reply+=dec.decode(value,{stream:true}); bot.textContent=reply; log.scrollTop=log.scrollHeight;
    }
    history.push({role:'model',content:reply});
  }catch(e){
    bot.textContent='Could not get a reply: '+e.message; history.pop();
  }
  send.disabled=false; input.focus();
}

form.addEventListener('submit',e=>{e.preventDefault();ask();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=input.scrollHeight+'px';});
document.getElementById('clear').onclick=()=>{history=[];log.innerHTML='<p class="empty">Ask anything to start the conversation.</p>';};
</script>
</body>
</html>
